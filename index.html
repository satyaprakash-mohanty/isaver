<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MESSAGE SAVER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap');body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
  background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMOGD0sgkP81APBU3phn-GybYKXugGvPiaDq0Yfof2G7Sklx_-4rcgJq1W&s=10') no-repeat center center fixed;
  background-size: cover;
}

.center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
}

h1 {
  font-family: 'UnifrakturCook', cursive;
  font-size: 48px;
  font-weight: bold;
  letter-spacing: 2px;
}

#fingerprint {
  width: 150px;
  height: 150px;
  margin: 20px auto;
  background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIBIBNJ-60A8_hYos0gZMX957yqYjPjn6tc_h-TJTNn9_3vu4vuXabIvPX&s=10') no-repeat center center;
  background-size: contain;
  cursor: pointer;
  transition: transform 0.3s ease;
}

#fingerprint:hover {
  transform: scale(1.05);
}

.hidden { display: none; }
.input { margin: 10px 0; padding: 8px; width: 200px; }
.button { padding: 10px 20px; cursor: pointer; margin-top: 10px; }

  </style>
</head>
<body>
  <div class="center" id="welcome">
    <h1>MESSAGE SAVER</h1>
    <div id="fingerprint" onclick="proceedToAuth()"></div>
    <p>Click the fingerprint to continue</p>
  </div>  <div class="center hidden" id="auth">
    <h2 id="authTitle">Login</h2>
    <input class="input" type="text" id="username" placeholder="Username" />
    <input class="input" type="password" id="password" placeholder="Password" />
    <p id="strength"></p>
    <button class="button" onclick="login()">Login</button>
    <button class="button" onclick="switchMode()">Or Create Account</button>
  </div>  <div class="center hidden" id="dashboard">
    <h2>Welcome, <span id="userDisplay"></span></h2>
    <textarea class="input" id="message" rows="4" cols="30" placeholder="Type your message..."></textarea><br>
    <button class="button" onclick="saveMessage()">Save</button>
    <button class="button" onclick="deleteMessage()">Delete</button>
  </div>  <script>
    let isRegistering = false;
    const dbName = 'MessageSaver';

    function proceedToAuth() {
      document.getElementById('welcome').classList.add('hidden');
      document.getElementById('auth').classList.remove('hidden');
    }

    function switchMode() {
      isRegistering = !isRegistering;
      document.getElementById('authTitle').innerText = isRegistering ? 'Register' : 'Login';
    }

    document.getElementById('password').addEventListener('input', () => {
      const val = document.getElementById('password').value;
      const strength = document.getElementById('strength');
      if (val.length < 6) strength.textContent = 'Weak';
      else if (val.match(/[0-9]/) && val.match(/[A-Z]/)) strength.textContent = 'Strong';
      else strength.textContent = 'Medium';
    });

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = e => {
          const db = e.target.result;
          const store = db.createObjectStore('users', { keyPath: 'username' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function hashPassword(password) {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(password));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function login() {
      const db = await openDB();
      const tx = db.transaction('users', 'readwrite');
      const store = tx.objectStore('users');
      const uname = username.value.trim();
      const pass = password.value.trim();
      const hashed = await hashPassword(pass);
      const request = store.get(uname);

      request.onsuccess = () => {
        const user = request.result;
        if (isRegistering) {
          if (user) return alert('User exists');
          store.put({ username: uname, password: hashed, message: '' });
          alert('Account created');
        } else {
          if (!user || user.password !== hashed) return alert('Invalid login');
          loadDashboard(user);
        }
      };
    }

    function loadDashboard(user) {
      document.getElementById('auth').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('userDisplay').innerText = user.username;
      document.getElementById('message').value = user.message || '';
    }

    async function saveMessage() {
      const db = await openDB();
      const uname = document.getElementById('userDisplay').textContent;
      const msg = document.getElementById('message').value;
      const tx = db.transaction('users', 'readwrite');
      const store = tx.objectStore('users');
      const req = store.get(uname);
      req.onsuccess = () => {
        const user = req.result;
        user.message = msg;
        store.put(user);
        alert('Message saved!');
      }
    }

    async function deleteMessage() {
      const db = await openDB();
      const uname = document.getElementById('userDisplay').textContent;
      const tx = db.transaction('users', 'readwrite');
      const store = tx.objectStore('users');
      const req = store.get(uname);
      req.onsuccess = () => {
        const user = req.result;
        user.message = '';
        store.put(user);
        document.getElementById('message').value = '';
        alert('Message deleted!');
      }
    }
  </script></body>
</html>
